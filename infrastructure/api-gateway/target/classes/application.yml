server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - AddRequestHeader=X-Request-Source, api-gateway
      routes:
        - id: catalogo-service
          uri: http://catalogo-service:8081
          predicates:
            - Path=/api/catalogo/**
          filters:
            - StripPrefix=2
        - id: inventario-service
          uri: http://inventario-service:8082
          predicates:
            - Path=/api/inventario/**
          filters:
            - StripPrefix=2
        - id: ventas-service
          uri: http://ventas-service:8083
          predicates:
            - Path=/api/ventas/**
          filters:
            - StripPrefix=2

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-server:9000/oauth2/jwks

management:
  endpoints:
    web:
      exposure:
        include: health,info
