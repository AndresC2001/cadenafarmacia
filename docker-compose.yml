services:
  services-db:
    image: postgres:15
    environment:
      POSTGRES_USER: services_user
      POSTGRES_PASSWORD: services_password
    volumes:
      - services-db-data:/var/lib/postgresql/data
      - ./infrastructure/db/init:/docker-entrypoint-initdb.d
    # Remover ports para mayor seguridad - solo acceso interno
    # ports:
    #   - "5433:5432"

  auth-db:
    image: postgres:15
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    # Remover ports para mayor seguridad - solo acceso interno
    # ports:
    #   - "5434:5432"

  auth-server:
    build: ./infrastructure/auth-server
    depends_on:
      - auth-db
    environment:
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      AUTH_DB_USER: auth_user
      AUTH_DB_PASSWORD: auth_password
      # OAuth2 Configuration
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-http://auth-server:9000}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-http://api-gateway:8080/login/oauth2/code/gateway-client}
      # CORS - orígenes permitidos separados por coma
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://frontend:80,http://frontend-react:80,http://localhost:3000,http://localhost:3001}
    ports:
      - "9000:9000"

  catalogo-service:
    build: ./services/catalogo-service
    depends_on:
      - services-db
    environment:
      CATALOGO_DB_URL: jdbc:postgresql://services-db:5432/catalogo_db
      CATALOGO_DB_USER: services_user
      CATALOGO_DB_PASSWORD: services_password
    ports:
      - "8081:8081"

  inventario-service:
    build: ./services/inventario-service
    depends_on:
      - services-db
      - catalogo-service
    environment:
      INVENTARIO_DB_URL: jdbc:postgresql://services-db:5432/inventario_db
      INVENTARIO_DB_USER: services_user
      INVENTARIO_DB_PASSWORD: services_password
      CATALOGO_URL: http://catalogo-service:8081
    ports:
      - "8082:8082"

  ventas-service:
    build: ./services/ventas-service
    depends_on:
      - services-db
      - catalogo-service
      - inventario-service
    environment:
      VENTAS_DB_URL: jdbc:postgresql://services-db:5432/ventas_db
      VENTAS_DB_USER: services_user
      VENTAS_DB_PASSWORD: services_password
      CATALOGO_URL: http://catalogo-service:8081
      INVENTARIO_URL: http://inventario-service:8082
    ports:
      - "8083:8083"

  api-gateway:
    build: ./infrastructure/api-gateway
    depends_on:
      - auth-server
      - catalogo-service
      - inventario-service
      - ventas-service
    environment:
      # JWT validation
      JWK_SET_URI: ${JWK_SET_URI:-http://auth-server:9000/oauth2/jwks}
      # Service URIs (for Azure, these would be internal ACA URLs)
      CATALOGO_SERVICE_URI: ${CATALOGO_SERVICE_URI:-http://catalogo-service:8081}
      INVENTARIO_SERVICE_URI: ${INVENTARIO_SERVICE_URI:-http://inventario-service:8082}
      VENTAS_SERVICE_URI: ${VENTAS_SERVICE_URI:-http://ventas-service:8083}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - api-gateway
    environment:
      AUTH_SERVER_URL: ${AUTH_SERVER_URL:-http://localhost:9000}
    ports:
      - "3001:81"

  frontend-react:
    build: ./frontend-react
    depends_on:
      - api-gateway
    environment:
      AUTH_SERVER_URL: ${AUTH_SERVER_URL:-http://localhost:9000}
      API_GATEWAY_URL: ${API_GATEWAY_URL:-/api}
    ports:
      - "3000:80"

volumes:
  services-db-data:
  auth-db-data: